[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtraffic"
version = "0.0.1"
description = "Dynamic fleet-routing platform (QPSO / EB-QPSO with live traffic)."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "numba",
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "osmnx",
    "redis",
    "ortools",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "pre-commit"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py311"]
